<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- AWS region -->
  <rect x="20" y="20" width="560" height="380" rx="10" fill="#fafafa" stroke="#232f3e" stroke-width="2"/>
  <text x="36" y="46" font-size="15" font-weight="bold" fill="#232f3e">AWS Region: us-east-2</text>

  <!-- VPC -->
  <rect x="50" y="64" width="500" height="312" rx="8" fill="#f5f0ff" stroke="#8c4fff" stroke-width="2"/>
  <text x="66" y="90" font-size="14" font-weight="bold" fill="#5a2db3">VPC: my-vpc</text>
  <text x="66" y="108" font-size="13" fill="#5a2db3">10.0.0.0/16</text>

  <!-- AZ -->
  <rect x="76" y="124" width="250" height="160" rx="6" fill="none" stroke="#7d8998" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="146" font-size="12" fill="#545b64">Availability Zone: us-east-2a</text>

  <!-- Public subnet -->
  <rect x="96" y="160" width="210" height="104" rx="6" fill="#e9f6ec" stroke="#248814" stroke-width="2"/>
  <text x="112" y="186" font-size="14" font-weight="bold" fill="#1d6b10">Public subnet: public-a</text>
  <text x="112" y="206" font-size="13" fill="#1d6b10">10.0.0.0/24</text>
  <text x="112" y="226" font-size="12" fill="#1d6b10">Auto-assign public IPv4: on</text>
  <text x="112" y="246" font-size="12" fill="#1d6b10">VPC router: 10.0.0.1</text>

  <!-- Route table -->
  <rect x="76" y="298" width="300" height="64" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
  <text x="90" y="318" font-size="13" font-weight="bold" fill="#232f3e">Main route table</text>
  <text x="90" y="337" font-size="12" fill="#232f3e" font-family="Menlo, Consolas, monospace">10.0.0.0/16 → local</text>
  <text x="90" y="354" font-size="12" fill="#232f3e" font-family="Menlo, Consolas, monospace">0.0.0.0/0   → my-igw</text>
  <line x1="200" y1="264" x2="200" y2="298" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="208" y="286" font-size="11" fill="#545b64">implicit association</text>

  <!-- Internet gateway on the VPC edge -->
  <rect x="510" y="186" width="80" height="56" rx="6" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
  <text x="550" y="210" font-size="13" font-weight="bold" fill="#5a2db3" text-anchor="middle">IGW</text>
  <text x="550" y="228" font-size="12" fill="#5a2db3" text-anchor="middle">my-igw</text>
  <line x1="306" y1="212" x2="510" y2="212" stroke="#232f3e" stroke-width="2"/>

  <!-- Internet -->
  <ellipse cx="680" cy="214" rx="62" ry="38" fill="#eef4fb" stroke="#232f3e" stroke-width="2"/>
  <text x="680" y="219" font-size="14" font-weight="bold" fill="#232f3e" text-anchor="middle">Internet</text>
  <line x1="590" y1="214" x2="618" y2="214" stroke="#232f3e" stroke-width="2"/>
</svg>
