<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- AWS region -->
  <rect x="20" y="20" width="700" height="480" rx="10" fill="#fafafa" stroke="#232f3e" stroke-width="2"/>
  <text x="36" y="46" font-size="15" font-weight="bold" fill="#232f3e">AWS Region: us-east-2</text>

  <!-- VPC -->
  <rect x="50" y="64" width="640" height="420" rx="8" fill="#f5f0ff" stroke="#8c4fff" stroke-width="2"/>
  <text x="66" y="90" font-size="14" font-weight="bold" fill="#5a2db3">VPC: my-vpc</text>
  <text x="66" y="108" font-size="13" fill="#5a2db3">10.0.0.0/16</text>

  <!-- AZ -->
  <rect x="76" y="124" width="380" height="200" rx="6" fill="none" stroke="#7d8998" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="146" font-size="12" fill="#545b64">Availability Zone: us-east-2a</text>

  <!-- Default NACL boundary around subnet -->
  <rect x="92" y="156" width="348" height="154" rx="6" fill="none" stroke="#d13212" stroke-width="2"/>
  <text x="102" y="174" font-size="12" font-weight="bold" fill="#a82a0c">Default NACL (associated): rule 100 allow all, * deny</text>

  <!-- Public subnet -->
  <rect x="108" y="184" width="316" height="112" rx="6" fill="#e9f6ec" stroke="#248814" stroke-width="2"/>
  <text x="124" y="208" font-size="14" font-weight="bold" fill="#1d6b10">Public subnet: public-a</text>
  <text x="124" y="226" font-size="13" fill="#1d6b10">10.0.0.0/24</text>

  <!-- Security group -->
  <rect x="124" y="238" width="284" height="46" rx="5" fill="#ffffff" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="136" y="257" font-size="12" font-weight="bold" fill="#a3162b">Security group: my-sg (stateful)</text>
  <text x="136" y="275" font-size="11" fill="#a3162b">Inbound: none yet · Outbound: all</text>

  <!-- Public route table -->
  <rect x="76" y="346" width="300" height="72" rx="6" fill="#ffffff" stroke="#248814" stroke-width="2"/>
  <text x="90" y="366" font-size="13" font-weight="bold" fill="#1d6b10">NextWork Route Table</text>
  <text x="90" y="385" font-size="12" fill="#232f3e" font-family="Menlo, Consolas, monospace">10.0.0.0/16 → local</text>
  <text x="90" y="402" font-size="12" fill="#232f3e" font-family="Menlo, Consolas, monospace">0.0.0.0/0   → my-igw</text>
  <line x1="220" y1="310" x2="220" y2="346" stroke="#248814" stroke-width="2"/>
  <text x="228" y="338" font-size="11" fill="#1d6b10">explicit association</text>

  <!-- Main route table -->
  <rect x="392" y="346" width="280" height="72" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
  <text x="406" y="366" font-size="13" font-weight="bold" fill="#232f3e">Main route table (no subnets)</text>
  <text x="406" y="385" font-size="12" fill="#232f3e" font-family="Menlo, Consolas, monospace">10.0.0.0/16 → local</text>
  <text x="406" y="402" font-size="12" fill="#232f3e" font-family="Menlo, Consolas, monospace">0.0.0.0/0   → my-igw</text>
  <text x="406" y="436" font-size="11" fill="#545b64">Lab 01 leftover: remove before Lab 03</text>

  <!-- Custom NACL, unattached -->
  <rect x="476" y="160" width="196" height="76" rx="6" fill="#ffffff" stroke="#d13212" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="488" y="180" font-size="12" font-weight="bold" fill="#a82a0c">public-nacl (stateless)</text>
  <text x="488" y="198" font-size="11" fill="#a82a0c">32767 deny all, in and out</text>
  <text x="488" y="216" font-size="11" fill="#545b64">Not associated yet</text>

  <!-- Internet gateway on the VPC edge -->
  <rect x="650" y="252" width="80" height="56" rx="6" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
  <text x="690" y="276" font-size="13" font-weight="bold" fill="#5a2db3" text-anchor="middle">IGW</text>
  <text x="690" y="294" font-size="12" fill="#5a2db3" text-anchor="middle">my-igw</text>
  <line x1="440" y1="280" x2="650" y2="280" stroke="#232f3e" stroke-width="2"/>
  <text x="76" y="452" font-size="12" fill="#545b64">Inbound: IGW → route table (local) → NACL inbound → SG inbound → instance</text>
  <text x="76" y="470" font-size="12" fill="#545b64">Reply: SG (stateful, auto) → NACL outbound (needs 1024–65535) → route table (0.0.0.0/0) → IGW</text>

  <!-- Internet -->
  <ellipse cx="820" cy="280" rx="62" ry="38" fill="#eef4fb" stroke="#232f3e" stroke-width="2"/>
  <text x="820" y="285" font-size="14" font-weight="bold" fill="#232f3e" text-anchor="middle">Internet</text>
  <line x1="730" y1="280" x2="758" y2="280" stroke="#232f3e" stroke-width="2"/>
</svg>
